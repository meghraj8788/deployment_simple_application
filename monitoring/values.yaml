grafana:
  enabled: true
  replicas: 1
  persistence:
    enabled: true
    storageClassName: gp3
    accessModes:
      - ReadWriteOnce
    size: 10Gi

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: "kubernetes"
          orgId: 1
          folder: "Kubernetes"
          type: file
          disableDeletion: false
          editable: false
          options:
            path: /var/lib/grafana/dashboards/kubernetes
  dashboards:
    kubernetes:
      kubernetes-cluster:
        gnetId: 15757
        revision: 37
        datasource: Prometheus

      kubernetes-nodes:
        gnetId: 1860
        revision: 37
        datasource: Prometheus

      kubernetes-pods:
        gnetId: 6417
        revision: 1
        datasource: Prometheus
prometheus:
  enabled: true

  prometheusSpec:
    retention: 15d

    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: gp3
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 50Gi

    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: "1"
        memory: 2Gi

alertmanager:
  enabled: true

  alertmanagerSpec:
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 250m
        memory: 256Mi
    secrets:                    # ✅ correct — nested inside alertmanagerSpec
      - alertmanager-smtp-secret  
  config:
    global:
      resolve_timeout: 5m
      smtp_smarthost: 'smtp.gmail.com:587'
      smtp_from: 'meghrajbackup8788@gmail.com'           # ← your Gmail address
      smtp_auth_username: 'meghrajbackup8788@gmail.com'  # ← same Gmail address
      smtp_auth_password_file: '/etc/alertmanager/secrets/alertmanager-smtp-secret/smtp-password'
      smtp_require_tls: true

    route:
      group_by: ['alertname', 'namespace', 'severity']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      receiver: 'default-email'

      routes:
        - matchers:
            - severity = critical
          receiver: 'critical-email'
          repeat_interval: 1h

        - matchers:
            - severity = warning
          receiver: 'warning-email'
          repeat_interval: 6h

    receivers:
      - name: 'default-email'
        email_configs:
          - to: 'meghrajbackup8788@gmail.com'     # ← who receives the alert
            send_resolved: true

      - name: 'critical-email'
        email_configs:
          - to: 'meghrajbackup8788@gmail.com'
            send_resolved: true
            headers:
              Subject: '[CRITICAL][K8s] {{ .GroupLabels.alertname }}'

      - name: 'warning-email'
        email_configs:
          - to: 'meghrajbackup8788@gmail.com'
            send_resolved: true
            headers:
              Subject: '[WARNING][K8s] {{ .GroupLabels.alertname }}'

    inhibit_rules:
      - source_matchers:
          - severity = critical
        target_matchers:
          - severity = warning
        equal: ['alertname', 'namespace']

